# Vendored turso_ext 0.6.1 with a host/target build.rs fix.
# See workspace [patch.crates-io] in /Cargo.toml.

[package]
edition = "2021"
name = "turso_ext"
version = "0.6.1"
authors = ["the Turso authors"]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Limbo extensions core"
readme = "README.md"
license = "MIT"
repository = "https://github.com/tursodatabase/turso"

[features]
core_only = []
static = []
vfs = []

[lib]
name = "turso_ext"
path = "src/lib.rs"

[dependencies.chrono]
version = "0.4.42"
default-features = true

[dependencies.getrandom]
version = "0.4.2"

[dependencies.turso_macros]
version = "0.6.1"
